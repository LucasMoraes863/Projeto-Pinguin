<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Quiz — Pinguins</title>
		<link rel="icon" href="../../images/penguin-logo.png" />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../../styles/main.css" />
		<link rel="stylesheet" href="../../styles/community.css" />
		<link rel="stylesheet" href="../../styles/quiz.css" />
		<script src="../../scripts/session.js"></script>
	</head>
	<body>
		<div class="sidebar">
			<a href="../../index.html" class="sidebar-logo"
				>PENGU<em class="emphasis-text">I</em>NS</a
			>

			<div class="sidebar-user">
				<div class="sidebar-avatar">
					<img
						class="sidebar-avatar"
						src="../../images/icons/user.png"
						alt=""
					/>
				</div>
				<div class="sidebar-user-info">
					<span class="sidebar-user-name" id="user_name_sidebar"></span>
				</div>
			</div>

			<p class="sidebar-label">Menu</p>
			<nav class="sidebar-nav">
				<a class="sidebar-nav-item" href="./main.html">Feed</a>
				<a class="sidebar-nav-item" href="./profile.html">Meu perfil</a>
				<a class="sidebar-nav-item" href="./dashboard.html">Dashboard</a>
				<a class="sidebar-nav-item active" href="./quiz.html">Quiz</a>
				<a class="sidebar-nav-item" href="./favorite.html">Favorito</a>
			</nav>

			<button class="sidebar-logout" onclick="limparSessao()">Sair</button>
		</div>

		<div class="main">
			<div class="desafio-main" id="quiz_screen">
				<div class="desafio-card">
					<div class="desafio-card-header">
						<p class="desafio-over-label" id="question_category"></p>
						<span class="badge-dificuldade" id="badge_dificuldade"></span>
					</div>

					<h2 class="desafio-question" id="question_text">
						Carregando perguntas…
					</h2>

					<div class="desafio-answers" id="answers_container"></div>

					<div class="explicacao" id="explicacao_box">
						<p class="explicacao-texto" id="explicacao_text"></p>
					</div>

					<button
						class="btn-solid"
						id="next_btn"
						style="display: none"
						onclick="proximaPergunta()"
					>
						Próxima →
					</button>
				</div>
			</div>

			<!-- Quiz ja realizado -->
			<div class="result-screen" id="blocked_screen" style="display: none">
				<div class="result-card">
					<p class="result-over-label">Seu melhor resultado</p>
					<h1 class="result-species-name" id="blocked_title">...</h1>

					<div class="result-wrap">
						<span class="result-num" id="blocked_right">...</span>
						<span class="result-de">acertos</span>
					</div>

					<p class="result-species-desc">
						Realizado em <span id="blocked_date">...</span>
					</p>

					<p class="result-species-desc">
						Você já completou este quiz. Quer tentar melhorar sua pontuação?
					</p>

					<div class="result-actions">
						<button class="btn-solid" onclick="desbloquearQuiz()">
							REFAZER O QUIZ
						</button>
					</div>
				</div>
			</div>

			<!-- RESULTADO -->
			<div class="result-screen" id="result_screen" style="display: none">
				<div class="result-card">
					<p class="result-over-label" id="res_subtitle"></p>
					<h1 class="result-species-name" id="res_title">—</h1>

					<div class="result-wrap">
						<span class="result-num" id="res_acertos">—</span>
						<span class="result-de">acertos</span>
					</div>

					<p class="result-species-desc" id="res_descricao">—</p>

					<div class="result-gabarito-title">Resumo da partida</div>
					<div class="result-gabarito" id="res_resumo"></div>

					<div class="result-actions" style="margin-top: 40px">
						<a href="./quiz.html" class="btn-solid">JOGAR NOVAMENTE</a>
					</div>
				</div>
			</div>
		</div>
		<!--  -->
	</body>

	<script src="../../scripts/quiz.js"></script>
</html>
