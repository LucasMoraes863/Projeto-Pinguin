<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dashboard — Pinguins</title>
		<link rel="icon" href="../../images/penguin-logo.png" />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../../styles/main.css" />
		<link rel="stylesheet" href="../../styles/community.css" />
		<link rel="stylesheet" href="../../styles/dashboard.css" />
		<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
		<script src="../../scripts/session.js"></script>
	</head>
	<body>
		<div class="sidebar">
			<a href="../../index.html" class="sidebar-logo"
				>PENGU<em class="emphasis-text">I</em>NS</a
			>
			<div class="sidebar-user">
				<div class="sidebar-avatar">
					<img
						class="sidebar-avatar"
						src="../../images/icons/user.png"
						alt=""
					/>
				</div>
				<div class="sidebar-user-info">
					<span class="sidebar-user-name" id="user_name_sidebar"></span>
				</div>
			</div>
			<p class="sidebar-label">Menu</p>
			<nav class="sidebar-nav">
				<a class="sidebar-nav-item" href="./main.html">Feed</a>
				<a class="sidebar-nav-item" href="./profile.html">Meu perfil</a>
				<a class="sidebar-nav-item active" href="./dashboard.html">Dashboard</a>
				<a class="sidebar-nav-item" href="./quiz.html">Quiz</a>
				<a class="sidebar-nav-item" href="./favorite.html">Favorito</a>
			</nav>
			<button class="sidebar-logout" onclick="limparSessao()">Sair</button>
		</div>

		<div class="main">
			<div class="topbar">
				<h1 class="topbar-title">Dash<em class="emphasis-text">board</em></h1>
			</div>

			<div class="dash-body">

				<div class="kpi-row">
					<div class="kpi-card">
						<span class="kpi-value" id="kpi_usuarios">—</span>
						<span class="kpi-label">Usuários</span>
					</div>
					<div class="kpi-card">
						<span class="kpi-value" id="kpi_posts">—</span>
						<span class="kpi-label">Posts</span>
					</div>
					<div class="kpi-card">
						<span class="kpi-value" id="kpi_tentativas">—</span>
						<span class="kpi-label">Quizzes feitos</span>
					</div>
					<div class="kpi-card kpi-card--accent">
						<span class="kpi-value" id="kpi_favorito">—</span>
						<span class="kpi-label">Pinguim mais amado</span>
					</div>
				</div>

				<div class="charts-row">
					<div class="chart-card chart-card--lg">
						<p class="chart-label">Ranking do quiz de conhecimentos</p>
						<div class="chart-wrap"><canvas id="chart_ranking"></canvas></div>
					</div>
					<div class="chart-card">
						<p class="chart-label">Pinguins favoritos da comunidade</p>
						<div class="chart-wrap"><canvas id="chart_favoritos"></canvas></div>
					</div>
				</div>

				<div class="charts-row">
					<div class="chart-card">
						<p class="chart-label">Posts por usuário (top 8)</p>
						<div class="chart-wrap"><canvas id="chart_posts"></canvas></div>
					</div>
					<div class="chart-card chart-card--lg">
						<p class="chart-label">Distribuição de pontuações no quiz</p>
						<div class="chart-wrap">
							<canvas id="chart_pontuacoes"></canvas>
						</div>
					</div>
				</div>
			</div>
		</div>
	</body>
	<script src="../../scripts/dashboard.js"></script>
</html>
