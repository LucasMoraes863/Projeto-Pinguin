<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Pinguim Favorito — Pinguins</title>
		<link rel="icon" href="../../images/penguin-logo.png" />
		<link
			href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="../../styles/main.css" />
		<link rel="stylesheet" href="../../styles/community.css" />
		<link rel="stylesheet" href="../../styles/favorite.css" />
		<script src="../../scripts/session.js"></script>
	</head>
	<body>
		<div class="sidebar">
			<a href="../../index.html" class="sidebar-logo"
				>PENGU<em class="emphasis-text">I</em>NS</a
			>
			<div class="sidebar-user">
				<div class="sidebar-avatar">
					<img
						class="sidebar-avatar"
						src="../../images/icons/user.png"
						alt=""
					/>
				</div>
				<div class="sidebar-user-info">
					<span class="sidebar-user-name" id="user_name_sidebar"></span>
				</div>
			</div>
			<p class="sidebar-label">Menu</p>
			<nav class="sidebar-nav">
				<a class="sidebar-nav-item" href="./main.html">Feed</a>
				<a class="sidebar-nav-item" href="./profile.html">Meu perfil</a>
				<a class="sidebar-nav-item" href="./dashboard.html">Dashboard</a>
				<a class="sidebar-nav-item" href="./quiz.html">Quiz</a>
				<a class="sidebar-nav-item active" href="./favorite.html">Favorito</a>
			</nav>
			<button class="sidebar-logout" onclick="limparSessao()">Sair</button>
		</div>

		<div class="main">
			<div class="result-screen" id="bloqueio_screen" style="display: none">
				<div class="result-img-wrap">
					<img id="bloqueio_img" src="" alt="" class="result-img" />
				</div>

				<div class="result-card">
					<p class="result-over-label">Seu pinguim favorito</p>
					<h1 class="result-species-name" id="bloqueio_nome">—</h1>
					<p class="result-cientifico" id="bloqueio_cientifico">—</p>
					<div class="result-actions">
						<button class="btn-solid" onclick="change()">TROCAR</button>
					</div>
				</div>
			</div>

			<!-- SELEÇÃO -->
			<div class="favorito-main" id="escolha_screen" style="display: none">
				<div class="favorito-header">
					<p class="topbar-over-label">Escolha</p>
					<h1 class="topbar-title">
						Qual é o seu pinguim <em class="emphasis-text">favorito?</em>
					</h1>
				</div>
				<div class="favorito-grid" id="especies_grid"></div>
			</div>
		</div>
	</body>
	<script src="../../scripts/favorite.js"></script>
</html>
